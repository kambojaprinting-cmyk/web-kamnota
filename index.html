<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Invoice Kamboja</title>
    <meta name="color-scheme" content="light">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4" style="background-color: #f3f4f6 !important;">

    <div id="invoice" class="max-w-md mx-auto p-6 shadow-lg border border-gray-200 class-invoice" 
         style="background-image: url('LatarInvoiceKamboja.jpg') !important; background-size: cover !important; background-position: center !important; color: #000000 !important; position: relative;">
        
        <div class="flex items-center gap-4 mb-6">
            <img src="http://localhost/LOGO_KAMBOJA.png" alt="Logo Kamboja" class="w-16 h-16 object-contain">
            <div>
                <h1 class="font-bold text-lg" style="color: #000000 !important;">KAMBOJA Printing</h1>
                <p class="text-xs" style="color: #000000 !important;">Jl. Tanjungpura Gang Kamboja Kios No. 3 Pontianak - Kalbar</p>
                <p class="text-xs font-bold" style="color: #000000 !important;">HP/WA : 0895-1588-1309</p>
            </div>
        </div>

        <div class="p-2 mb-4 text-right font-bold uppercase tracking-wider text-white" 
             style="background-color: #1f2937 !important;">
            INVOICE
        </div>
        
        <div class="text-xs mb-4" style="color: #000000 !important;">
            <div class="flex items-center gap-1 mb-1">
                <span class="w-24 text-black">Kepada Yth :</span>
                <input type="text" id="custName" class="border-b flex-1 outline-none font-bold" placeholder="Nama Pelanggan" 
                       style="background-color: transparent !important; color: #000000 !important; border-bottom-color: #cccccc !important;">
            </div>
            <div class="flex items-center gap-1 mb-1">
                <span class="w-24 text-black">Invoice no :</span>
                <input type="text" id="invNumber" class="border-b flex-1 outline-none font-bold" value="INV-2026-001" 
                       style="background-color: transparent !important; color: #000000 !important; border-bottom-color: #cccccc !important;">
            </div>
            <div class="flex items-center gap-1">
                <span class="w-24 text-black">Tanggal :</span>
                <input type="text" id="invDate" class="border-b flex-1 outline-none font-bold" value="" 
                       style="background-color: transparent !important; color: #000000 !important; border-bottom-color: #cccccc !important;">
            </div>
        </div>

        <table class="w-full text-xs mb-6 border-collapse table-fixed">
            <thead>
                <tr style="background-color: rgba(229, 231, 235, 0.8) !important; backdrop-filter: blur(1px);">
                    <th class="p-1 text-center w-[6%]" style="color: #000000 !important;">No.</th>
                    <th class="p-1 text-left w-[42%]" style="color: #000000 !important;">Deskripsi</th>
                    <th class="p-1 text-center w-[12%]" style="color: #000000 !important;">Qty</th>
                    <th class="p-1 text-right w-[18%]" style="color: #000000 !important;">Harga</th>
                    <th class="p-1 text-right w-[22%]" style="color: #000000 !important;">Total</th>
                </tr>
            </thead>
            <tbody id="itemsBody">
                <tr style="height: 28px;">
                    <td class="p-1 border-b text-center row-no" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">1.</td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;">
                        <input type="text" class="w-full outline-none desc-input" placeholder="Nama Barang 1" style="background-color: transparent !important; color: #000000 !important;">
                    </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;">
                        <input type="number" class="w-full text-center outline-none qty-input" placeholder="1" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;">
                    </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;">
                        <input type="text" inputmode="numeric" class="w-full text-right outline-none price-input" placeholder="0" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;">
                    </td>
                    <td class="p-1 border-b text-right row-total" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">0</td>
                </tr>
                <tr style="height: 28px;">
                    <td class="p-1 border-b text-center row-no" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">2.</td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" class="w-full outline-none desc-input" placeholder="Nama Barang 2" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="number" class="w-full text-center outline-none qty-input" placeholder="1" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" inputmode="numeric" class="w-full text-right outline-none price-input" placeholder="0" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b text-right row-total" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">0</td>
                </tr>
                <tr style="height: 28px;">
                    <td class="p-1 border-b text-center row-no" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">3.</td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" class="w-full outline-none desc-input" placeholder="Nama Barang 3" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="number" class="w-full text-center outline-none qty-input" placeholder="1" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" inputmode="numeric" class="w-full text-right outline-none price-input" placeholder="0" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b text-right row-total" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">0</td>
                </tr>
                <tr style="height: 28px;">
                    <td class="p-1 border-b text-center row-no" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">4.</td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" class="w-full outline-none desc-input" placeholder="Nama Barang 4" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="number" class="w-full text-center outline-none qty-input" placeholder="1" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" inputmode="numeric" class="w-full text-right outline-none price-input" placeholder="0" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b text-right row-total" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">0</td>
                </tr>
                <tr style="height: 28px;">
                    <td class="p-1 border-b text-center row-no" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">5.</td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" class="w-full outline-none desc-input" placeholder="Nama Barang 5" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="number" class="w-full text-center outline-none qty-input" placeholder="1" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b" style="border-bottom-color: rgba(229, 231, 235, 0.6) !important;"> <input type="text" inputmode="numeric" class="w-full text-right outline-none price-input" placeholder="0" oninput="calculate()" style="background-color: transparent !important; color: #000000 !important;"> </td>
                    <td class="p-1 border-b text-right row-total" style="color: #000000 !important; border-bottom-color: rgba(229, 231, 235, 0.6) !important;">0</td>
                </tr>
            </tbody>
        </table>

        <div class="flex justify-end gap-4 font-bold text-sm mb-8" style="color: #000000 !important;">
            <span>TOTAL</span>
            <span id="grandTotal" style="color: #000000 !important;">0</span>
        </div>

        <p class="font-bold" style="color: #000000 !important; font-size: 10px;">ORDER DIPROSES SETELAH PEMBAYARAN DITERIMA</p>
        <div class="mt-8 text-right text-xs" style="color: #000000 !important;">
            <p style="color: #000000 !important;">Hormat Kami,</p>
            <br><br>
            <p class="font-bold" style="color: #000000 !important;">KAMBOJA PRINTING</p>
        </div>
    </div>

    <div id="areaTombol" class="max-w-md mx-auto mt-6 flex px-4" style="display: none !important;">
        <button id="btnShare" class="flex-1 bg-blue-600 text-white py-2.5 px-6 rounded-lg font-bold text-sm tracking-wide shadow-md active:bg-blue-700 transition-colors">
            Simpan / Bagikan
        </button>
    </div>

<style>
    html, body {
        background-color: #f3f4f6 !important;
        margin: 0 !important;
        padding: 0 !important;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    #invoice { color: #000000 !important; }
    .mode-potret #areaTombol { display: none !important; }
    .mode-potret, .mode-potret body {
        height: min-content !important;
        min-height: 0 !important;
        background-color: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    .mode-potret #invoice {
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
</style>

<script>
        let autoInvoiceEnabled = true;
        const invNumberInput = document.getElementById('invNumber');

        if (invNumberInput) {
            invNumberInput.addEventListener('input', function() { autoInvoiceEnabled = false; });
            invNumberInput.addEventListener('focus', function() { autoInvoiceEnabled = false; });
        }

        function updateInvoiceNumberFromApp(newNumber) {
            if (autoInvoiceEnabled && invNumberInput) {
                invNumberInput.value = String(newNumber);
            }
        }

        function getTanggalHariIni() {
            const hariIni = new Date();
            const opsi = { day: 'numeric', month: 'long', year: 'numeric' };
            return hariIni.toLocaleDateString('id-ID', opsi);
        }

        document.addEventListener("DOMContentLoaded", function() {
            const dateInput = document.getElementById('invDate');
            if (dateInput && dateInput.value === "") {
                dateInput.value = getTanggalHariIni();
            }
        });

        function updateCustomerDataFromApp(paketData) {
            const nameInput = document.getElementById('custName');
            const dateInput = document.getElementById('invDate');
            const tanggalHariIni = getTanggalHariIni();

            // Sembunyikan kembali baris yang tadinya tersembunyi jika memuat data baru
            let rows = document.querySelectorAll('#itemsBody tr');
            rows.forEach(row => row.style.display = "");

            if (paketData && paketData.includes('|')) {
                let pecahData = paketData.split('|');
                
                if (pecahData[2] === "ya") {
                    if (nameInput) nameInput.value = "";
                    if (dateInput) dateInput.value = tanggalHariIni;
                    clearAllItems();
                } else {
                    if (nameInput) nameInput.value = pecahData[0];
                    if (dateInput) {
                        dateInput.value = (pecahData[1] && pecahData[1].trim() !== "") ? pecahData[1] : tanggalHariIni;
                    }
                    if (pecahData[3] && pecahData[3].trim() !== "") {
                        muatPaketItemKeTabel(pecahData[3]);
                    }
                }
            } else {
                if (dateInput) dateInput.value = tanggalHariIni;
            }
        }
		
		function clearInvoiceTable() {
            let rows = document.querySelectorAll('#itemsBody tr');
            rows.forEach(row => {
                row.style.display = ""; // Tampilkan semua baris
                row.querySelector('.desc-input').value = "";
                row.querySelector('.qty-input').value = "";
                row.querySelector('.price-input').value = "";
                row.querySelector('.row-total').innerText = "0";
            });
            document.getElementById('grandTotal').innerText = "0";
            if (document.getElementById('custName')) document.getElementById('custName').value = ""; 
            if (document.getElementById('invDate')) document.getElementById('invDate').value = "";
        }

        function muatPaketItemKeTabel(stringItem) {
            let barisData = stringItem.split('~');
            let rows = document.querySelectorAll('#itemsBody tr');
            
            barisData.forEach((dataBaris, index) => {
                if (rows[index] && dataBaris.includes('#')) {
                    let kolom = dataBaris.split('#');
                    rows[index].querySelector('.desc-input').value = kolom[0] || "";
                    
                    let qtyVal = kolom[1] || "";
                    rows[index].querySelector('.qty-input').value = (qtyVal === "1" || qtyVal === "") ? "" : qtyVal;
                    
                    rows[index].querySelector('.price-input').value = kolom[2] || "";
                }
            });
            calculate();
        }

        function clearAllItems() {
            let rows = document.querySelectorAll('#itemsBody tr');
            rows.forEach(row => {
                row.style.display = "";
                row.querySelector('.desc-input').value = "";
                row.querySelector('.qty-input').value = "";
                row.querySelector('.price-input').value = "";
                row.querySelector('.row-total').innerText = "0";
            });
            document.getElementById('grandTotal').innerText = "0";
        }

        function calculate() {
            let rows = document.querySelectorAll('#itemsBody tr');
            let total = 0;
            rows.forEach(row => {
                let qtyInput = row.querySelector('.qty-input');
                let priceInput = row.querySelector('.price-input');
                let rowTotal = row.querySelector('.row-total');
                
                let qty = parseFloat(qtyInput.value);
                if (isNaN(qty) || qty < 0) qty = 1;
                
                let priceDigits = priceInput.value.replace(/\D/g, '');
                let price = parseFloat(priceDigits);
                if (isNaN(price) || price < 0) price = 0;
                
                if (priceInput.value !== "" && price > 0) {
                    priceInput.value = price.toLocaleString('id-ID');
                } else if (price === 0 && priceInput.value !== "") {
                    priceInput.value = "";
                }
                
                let subtotal = qty * price;
                total += subtotal;
                rowTotal.innerText = subtotal > 0 ? subtotal.toLocaleString('id-ID') : "0";
            });
            document.getElementById('grandTotal').innerText = total > 0 ? total.toLocaleString('id-ID') : "0";
        }

        function prosesInvoice(aksi) {
            let currentInvNumber = document.getElementById('invNumber') ? document.getElementById('invNumber').value : "";
            let currentName = document.getElementById('custName') ? document.getElementById('custName').value : "";
            let currentDate = document.getElementById('invDate') ? document.getElementById('invDate').value : "";

            let paketItem = [];
            let rows = document.querySelectorAll('#itemsBody tr');
            let nomorUrutDisplay = 1;
            
            rows.forEach(row => {
                let descInput = row.querySelector('.desc-input');
                let qtyInput = row.querySelector('.qty-input');
                let priceInput = row.querySelector('.price-input');
                let rowNo = row.querySelector('.row-no');
                
                let desc = descInput && descInput.value.trim() !== "" ? descInput.value.trim() : "";
                let qty = qtyInput && qtyInput.value.trim() !== "" ? qtyInput.value.trim() : "1";
                
                let priceDigits = priceInput.value.replace(/\D/g, '');
                let valPrice = parseFloat(priceDigits);
                if (isNaN(valPrice)) valPrice = 0;
                let priceStr = valPrice > 0 ? priceDigits : "";

                if (desc === "" && valPrice === 0) {
                    // Sembunyikan baris kosong saat aksi bagikan (potret)
                    if (aksi === 'bagikan') {
                        row.style.display = 'none';
                    }
                } else {
                    row.style.display = ''; // Pastikan baris terisi tetap tampil
                    if (rowNo) rowNo.innerText = nomorUrutDisplay + ".";
                    nomorUrutDisplay++;
                    paketItem.push(desc + "#" + qty + "#" + priceStr);
                }

                // Hilangkan placeholder jika mau dipotret
                if (aksi === 'bagikan') {
                    if (descInput) descInput.placeholder = "";
                    if (qtyInput) qtyInput.placeholder = "";
                    if (priceInput) priceInput.placeholder = "";
                }
            });

            let stringHasilTabel = paketItem.length > 0 ? paketItem.join('~') : "-";
            let teksTotal = document.getElementById('grandTotal').innerText;
            let totalHarga = teksTotal.replace(/\D/g, '');
            if (totalHarga === "") totalHarga = "0";

            let dpDigits = "0";
            let noHp = "-";

            if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString("simpan_data|" + currentInvNumber + "|" + currentName + "|" + currentDate + "|" + stringHasilTabel + "|" + dpDigits + "|" + totalHarga + "|" + noHp);
            }

            if (aksi === 'bagikan') {
                setTimeout(function() {
                    if (window.AppInventor && window.AppInventor.setWebViewString) {
                        window.AppInventor.setWebViewString("potret_sekarang");
                    }
                }, 100);
            }
        }

        let delayBlur;
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                clearTimeout(delayBlur); 
                if (window.AppInventor && window.AppInventor.setWebViewString) {
                    window.AppInventor.setWebViewString("keyboard_aktif");
                }
            });
            
            input.addEventListener('blur', () => {
                delayBlur = setTimeout(() => {
                    if (window.AppInventor && window.AppInventor.setWebViewString) {
                        window.AppInventor.setWebViewString("keyboard_nonaktif");
                    }
                }, 300);
            });
        });
    </script>
</body>
</html>
